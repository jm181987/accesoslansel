<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accesos LANSEL</title><link rel="stylesheet" href="/styles.css"></head><body><header><h1>🔐 Accesos LANSEL</h1><div><span id="who"></span><button id="logout" class="hidden">Salir</button></div></header><main><p id="message"></p><section id="login" class="panel"><h2>Iniciar sesión</h2><form id="loginForm"><label>Correo<input type="email" name="email" required></label><label>Contraseña<input type="password" name="password" required></label><button>Ingresar</button></form></section><div id="app" class="hidden"><section class="panel"><h2>Mis accesos privados</h2><p class="muted">Enlaces y credenciales asignados a tu usuario.</p><div id="cards" class="grid"></div></section><div id="admin" class="hidden"><section class="panel"><h2>Crear funcionario</h2><form id="newUser"><label>Nombre<input name="name" required></label><label>Correo<input name="email" type="email" required></label><label>Contraseña inicial<input name="password" type="password" minlength="12" required></label><button>Crear</button></form></section><section class="panel"><h2>Asignar acceso</h2><form id="newAccess"><label>Funcionario<select id="userId" name="userId" required></select></label><label>Nombre de plataforma<input name="title" required placeholder="CRM Monety"></label><label>Enlace<input name="url" type="url" required placeholder="https://..."></label><label>Usuario<input name="username" required></label><label>Contraseña<input name="password" type="password" required></label><button>Asignar</button></form></section><section class="panel"><h2>Funcionarios</h2><div id="users"></div></section></div></div></main><script src="/app.js" defer></script></body></html>
